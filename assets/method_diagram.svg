<svg xmlns="http://www.w3.org/2000/svg" width="720pt" height="340pt" viewBox="0 0 720 340" role="img" aria-labelledby="title description">
<title id="title">Federated research: code updates outside, local training inside</title>
<desc id="description">A fixed research language model proposes code and uses measured outcomes to select the next artifact. In the federated-training implementation, clients evaluate a shared parameter vector on local rows and return summed loss and gradients to a trusted optimizer. Separate role workers evaluate fitted candidates. Only scores and diagnostics reach the research context; raw rows and training gradients do not. Earlier evidence-only studies do not run the inner federated optimizer.</desc>
