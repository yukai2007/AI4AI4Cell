<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 540" width="1000" height="540" font-family="Helvetica, Arial, sans-serif">
  <title>BioCoLoop framework</title>
  <defs>
    <!-- arrowheads -->
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B5BA8"/></marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E8B57"/></marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7550B5"/></marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B7280"/></marker>

    <!-- icons: 48 x 48 grid, stroke = currentColor -->
    <g id="i-bulb" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 5a13 13 0 0 0-8 23.3c1.6 1.3 2.5 3 2.5 4.7h11c0-1.7.9-3.4 2.5-4.700A13 13 0 0 0 24 5z" fill="#FFE9A8"/>
      <path d="M19 39h10M21.5 44h5"/>
    </g>
    <g id="i-code" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4h17l9 9v31H11z" fill="#fff"/>
      <path d="M28 4v9h9"/>
      <path d="M21 24l-5 5 5 5M27 24l5 5-5 5"/>
    </g>
    <g id="i-fed" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 16L8 36M24 16v20M24 16l16 20"/>
      <circle cx="24" cy="11" r="6.5" fill="#BFE6CF"/>
      <circle cx="8" cy="39" r="4.5" fill="#fff"/>
      <circle cx="24" cy="39" r="4.5" fill="#fff"/>
      <circle cx="40" cy="39" r="4.5" fill="#fff"/>
    </g>
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="24" cy="24" r="18" fill="#fff"/>
      <path d="M15 24.500l6.5 6.500L34 17.5" stroke-width="3.4"/>
    </g>
    <g id="i-cards" fill="#fff" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="4" width="26" height="32" rx="3"/>
      <rect x="11" y="8" width="26" height="32" rx="3"/>
      <rect x="6" y="12" width="26" height="32" rx="3"/>
      <path d="M12 21h14M12 27h9M12 36l3 3 6-6.5" fill="none"/>
    </g>
    <g id="i-server" fill="#fff" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="7" width="38" height="14" rx="3.5"/>
      <rect x="5" y="27" width="38" height="14" rx="3.5"/>
      <path d="M22 14h14M22 34h14" fill="none"/>
      <circle cx="13" cy="14" r="1.8" fill="currentColor"/>
      <circle cx="13" cy="34" r="1.8" fill="currentColor"/>
    </g>
    <g id="i-db" fill="#fff" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 10v27c0 3 6.3 5.5 14 5.500S36 40 36 37V10z"/>
      <ellipse cx="22" cy="10" rx="14" ry="5.5"/>
      <path d="M8 19.500c0 3 6.3 5.5 14 5.500s14-2.5 14-5.500M8 28.500c0 3 6.3 5.5 14 5.500s14-2.5 14-5.5" fill="none"/>
    </g>
    <g id="i-lock" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9V6a5 5 0 0 1 10 0v3" fill="none"/>
      <rect x="0.5" y="9" width="17" height="12" rx="2.5" fill="currentColor"/>
    </g>
    <g id="i-net" fill="#fff" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 14L24 7M8 14l16 10M8 14l16 27M8 34L24 7M8 34l16-10M8 34l16 7M24 7l16 17M24 24h16M24 41l16-17" fill="none" stroke-width="1.5"/>
      <circle cx="8" cy="14" r="4.5"/><circle cx="8" cy="34" r="4.5"/>
      <circle cx="24" cy="7" r="4.5"/><circle cx="24" cy="24" r="4.5"/><circle cx="24" cy="41" r="4.5"/>
      <circle cx="40" cy="24" r="4.5"/>
    </g>
    <g id="i-dti" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 12.500A13.5 13.5 0 1 1 29 35.500L34 24z" fill="#F6D9C4"/>
      <path d="M14 14.500l8.2 4.750v9.500L14 33.500l-8.2-4.750v-9.500z" fill="#fff"/>
      <path d="M14 18.500l4.7 2.700v5.5"/>
    </g>
    <g id="i-spec" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 42h38"/>
      <path d="M11 42V24M18 42V8M25 42V30M32 42V16M39 42V33"/>
    </g>
    <g id="i-cell" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 9c9-1 17 5 18 14s-4 18-14 19S7 38 6 28 12 10 22 9z" fill="#fff"/>
      <circle cx="20" cy="28" r="6.5" fill="#F6D9C4"/>
      <path d="M40 1l-7 10h7l-6 10" stroke="#D9762B" stroke-width="3"/>
    </g>
    <g id="i-bars" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 5v38h38"/>
      <rect x="12" y="26" width="6.5" height="17" fill="#fff"/>
      <rect x="23" y="17" width="6.5" height="26" fill="#fff"/>
      <rect x="34" y="9" width="6.5" height="34" fill="#DCCFF3"/>
    </g>
    <g id="i-snow" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M7 0v14M0.9 3.500l12.2 7M0.9 10.500l12.2-7"/>
    </g>
  </defs>

  <rect width="1000" height="540" fill="#fff"/>

  <!-- ================= TASKS ================= -->
  <rect x="12" y="20" width="118" height="500" rx="14" fill="#FBF3EC" stroke="#E7CDB8" stroke-width="1.5"/>
  <text x="71" y="46" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#A8561B">TASKS</text>
  <g color="#A8561B" fill="#3A3A3A" font-size="15" text-anchor="middle">
    <use xlink:href="#i-dti" href="#i-dti" transform="translate(43 86) scale(1.170)"/>
    <text x="71" y="165">Drug–target</text>
    <use xlink:href="#i-spec" href="#i-spec" transform="translate(43 238) scale(1.170)"/>
    <text x="71" y="317">Proteomics</text>
    <use xlink:href="#i-cell" href="#i-cell" transform="translate(43 390) scale(1.170)"/>
    <text x="71" y="469">Perturbation</text>
  </g>
  <path d="M132 140H157" stroke="#6B7280" stroke-width="2.2" marker-end="url(#ah-gray)"/>
  <path d="M132 392H157" stroke="#6B7280" stroke-width="2.2" marker-end="url(#ah-gray)"/>

  <!-- ================= OUTER RESEARCH LOOP ================= -->
  <rect x="160" y="20" width="640" height="215" rx="14" fill="#EEF3FB" stroke="#C3D3EC" stroke-width="1.5"/>
  <text x="178" y="46" font-size="15" font-weight="700" letter-spacing="1.2" fill="#2B5BA8">RESEARCH LOOP</text>

  <!-- feedback path -->
  <path d="M720 100V66H240V98" fill="none" stroke="#2B5BA8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#ah-blue)"/>
  <rect x="396" y="47" width="168" height="38" rx="19" fill="#fff" stroke="#2B5BA8" stroke-width="1.8"/>
  <use xlink:href="#i-cards" href="#i-cards" transform="translate(410 53) scale(0.540)" color="#2B5BA8"/>
  <text x="444" y="72" font-size="16" fill="#1F3F78">evidence <tspan font-style="italic" font-family="Georgia, 'Times New Roman', serif" font-size="18">E</tspan><tspan font-style="italic" font-family="Georgia, 'Times New Roman', serif" font-size="12" dy="4">t</tspan></text>

  <!-- step arrows -->
  <g stroke="#2B5BA8" stroke-width="2.2" fill="none">
    <path d="M282 140H357" marker-end="url(#ah-blue)"/>
    <path d="M442 140H517" marker-end="url(#ah-blue)"/>
    <path d="M602 140H677" marker-end="url(#ah-blue)"/>
  </g>
  <g font-size="14" fill="#5B6B85" text-anchor="middle">
    <text x="320" y="130">proposal</text>
    <text x="480" y="130">design</text>
    <text x="640" y="130">dev score</text>
  </g>

  <!-- nodes -->
  <g color="#2B5BA8">
    <rect x="202" y="102" width="76" height="76" rx="16" fill="#fff" stroke="#2B5BA8" stroke-width="2"/>
    <use xlink:href="#i-bulb" href="#i-bulb" transform="translate(218 117)" />
    <rect x="362" y="102" width="76" height="76" rx="16" fill="#fff" stroke="#2B5BA8" stroke-width="2"/>
    <use xlink:href="#i-code" href="#i-code" transform="translate(376 116)"/>
    <rect x="682" y="102" width="76" height="76" rx="16" fill="#fff" stroke="#2B5BA8" stroke-width="2"/>
    <use xlink:href="#i-check" href="#i-check" transform="translate(696 116)"/>
  </g>
  <g color="#1E6B43">
    <rect x="522" y="102" width="76" height="76" rx="16" fill="#E9F6EE" stroke="#2E8B57" stroke-width="2.4"/>
    <use xlink:href="#i-fed" href="#i-fed" transform="translate(536 115)"/>
  </g>
  <!-- number badges -->
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <circle cx="204" cy="104" r="11" fill="#2B5BA8"/><text x="204" y="108.5">1</text>
    <circle cx="364" cy="104" r="11" fill="#2B5BA8"/><text x="364" y="108.5">2</text>
    <circle cx="524" cy="104" r="11" fill="#2E8B57"/><text x="524" y="108.5">3</text>
    <circle cx="684" cy="104" r="11" fill="#2B5BA8"/><text x="684" y="108.5">4</text>
  </g>
  <g font-size="17" font-weight="700" fill="#1F2937" text-anchor="middle">
    <text x="240" y="200">Propose</text>
    <text x="400" y="200">Compile</text>
    <text x="560" y="200">Fit + evaluate</text>
    <text x="720" y="200">Select</text>
  </g>
  <use xlink:href="#i-snow" href="#i-snow" transform="translate(190 208)" color="#4B8FD6"/>
  <text x="209" y="220" font-size="14" fill="#5B6B85">frozen LLM <tspan font-style="italic" font-family="Georgia, 'Times New Roman', serif" font-size="15">S</tspan></text>

  <!-- step 3 expands into the inner loop -->
  <path d="M560 212V300" stroke="#2E8B57" stroke-width="2.6" marker-start="url(#ah-green)" marker-end="url(#ah-green)"/>

  <!-- ================= INNER COLLABORATIVE FITTING ================= -->
  <rect x="160" y="265" width="640" height="255" rx="14" fill="#EDF7F1" stroke="#BFDFCB" stroke-width="1.5"/>
  <path d="M560 236V300" stroke="#2E8B57" stroke-width="2.6" marker-end="url(#ah-green)"/>
  <text x="178" y="291" font-size="15" font-weight="700" letter-spacing="1.2" fill="#1E6B43">COLLABORATIVE FITTING</text>

  <!-- coordinator -->
  <rect x="205" y="304" width="550" height="46" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="2"/>
  <use xlink:href="#i-server" href="#i-server" transform="translate(398 311) scale(0.670)" color="#1E6B43"/>
  <text x="440" y="333" font-size="17" font-weight="700" fill="#1F2937">Coordinator</text>

  <!-- coordinator <-> labs -->
  <g stroke-width="2.2" fill="none">
    <path d="M270 352V389" stroke="#2B5BA8" marker-end="url(#ah-blue)"/>
    <path d="M290 390V353" stroke="#2E8B57" marker-end="url(#ah-green)"/>
    <path d="M470 352V389" stroke="#2B5BA8" marker-end="url(#ah-blue)"/>
    <path d="M490 390V353" stroke="#2E8B57" marker-end="url(#ah-green)"/>
    <path d="M670 352V389" stroke="#2B5BA8" marker-end="url(#ah-blue)"/>
    <path d="M690 390V353" stroke="#2E8B57" marker-end="url(#ah-green)"/>
  </g>
  <text x="262" y="376" font-size="14" fill="#2B5BA8" text-anchor="end">weights</text>
  <text x="298" y="376" font-size="14" fill="#1E6B43">updates + scores</text>

  <!-- labs -->
  <g id="lab1">
    <rect x="205" y="392" width="150" height="88" rx="12" fill="#fff" stroke="#2E8B57" stroke-width="1.8"/>
    <text x="280" y="412" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Lab 1</text>
    <use xlink:href="#i-db" href="#i-db" transform="translate(222 420) scale(0.920)" color="#1E6B43"/>
    <use xlink:href="#i-lock" href="#i-lock" transform="translate(246 446) scale(0.9)" color="#C2410C"/>
    <path d="M272 444H296" stroke="#1E6B43" stroke-width="2" marker-end="url(#ah-green)"/>
    <use xlink:href="#i-net" href="#i-net" transform="translate(302 422) scale(0.920)" color="#1E6B43"/>
  </g>
  <use xlink:href="#lab1" href="#lab1" transform="translate(200 0)"/>
  <rect x="460" y="398" width="40" height="20" fill="#fff"/>
  <text x="480" y="412" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Lab 2</text>
  <use xlink:href="#lab1" href="#lab1" transform="translate(400 0)"/>
  <rect x="660" y="398" width="40" height="20" fill="#fff"/>
  <text x="680" y="412" font-size="15" font-weight="700" fill="#1F2937" text-anchor="middle">Lab <tspan font-style="italic" font-family="Georgia, 'Times New Roman', serif">K</tspan></text>
  <g fill="#1E6B43"><circle cx="572" cy="438" r="2.6"/><circle cx="580" cy="438" r="2.6"/><circle cx="588" cy="438" r="2.6"/></g>

  <use xlink:href="#i-lock" href="#i-lock" transform="translate(398 490) scale(0.720)" color="#C2410C"/>
  <text x="418" y="505" font-size="14" fill="#7C2D12">raw data stays local</text>

  <!-- ================= OUTPUT ================= -->
  <rect x="828" y="20" width="160" height="500" rx="14" fill="#F3EFFA" stroke="#D5C8EE" stroke-width="1.5"/>
  <text x="908" y="46" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.2" fill="#5B3A9B">OUTPUT</text>
  <path d="M760 140H868" stroke="#7550B5" stroke-width="2.4" marker-end="url(#ah-purple)"/>
  <path d="M757 327H868" stroke="#7550B5" stroke-width="2.4" marker-end="url(#ah-purple)"/>
  <g color="#5B3A9B">
    <rect x="870" y="102" width="76" height="76" rx="16" fill="#fff" stroke="#7550B5" stroke-width="2"/>
    <use xlink:href="#i-code" href="#i-code" transform="translate(884 116)"/>
    <rect x="870" y="289" width="76" height="76" rx="16" fill="#fff" stroke="#7550B5" stroke-width="2"/>
    <use xlink:href="#i-net" href="#i-net" transform="translate(884 303)"/>
    <path d="M908 392V416" stroke="#7550B5" stroke-width="2.2" marker-end="url(#ah-purple)"/>
    <use xlink:href="#i-bars" href="#i-bars" transform="translate(884 424)"/>
  </g>
  <g font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">
    <text x="908" y="200">Best design</text>
    <text x="908" y="386" font-size="16">Fitted model</text>
    <text x="908" y="496">Held-out test</text>
  </g>
</svg>
